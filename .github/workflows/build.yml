name: Build IX Sandbox

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FC_VERSION: "1.15.1"                                    # firecracker + jailer pin
  SDK_COMPAT: "0.2"                                       # go-sdk minor ixd targets

jobs:
  test-daemon:
    name: Daemon (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        working-directory: daemon
        run: cargo test --all

      - name: Build (musl static)
        working-directory: daemon
        run: cargo build --release --target x86_64-unknown-linux-musl -p ix-server

      - name: Upload daemon binary
        uses: actions/upload-artifact@v4
        with:
          name: ixd-linux-amd64
          path: daemon/target/x86_64-unknown-linux-musl/release/ixd

  test-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go-sdk/go.mod
          cache-dependency-path: go-sdk/go.sum

      - name: Test
        working-directory: go-sdk
        run: go test ./... -count=1

  build-image:
    name: Docker Image (${{ matrix.stage }})
    needs: [test-daemon]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - stage: base
            suffix: ""          # base is the default image (and :latest)
          - stage: browser
            suffix: "-browser"
          - stage: browser-vm
            suffix: "-browser-vm"
    steps:
      - uses: actions/checkout@v5

      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: ixd-linux-amd64
          path: daemon/target/x86_64-unknown-linux-musl/release/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ matrix.stage == 'base' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: daemon
          file: daemon/cmd/Dockerfile
          target: ${{ matrix.stage }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ix-${{ matrix.stage }}
          cache-to: type=gha,mode=max,scope=ix-${{ matrix.stage }}

  build-bundle:
    name: Rootfs bundle
    needs: [build-image]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write          # create release + upload asset
      packages: read
    steps:
      - uses: actions/checkout@v5

      - name: Tools (e2fsprogs, zstd)
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs zstd

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull base image (this tag)
        run: |
          docker pull "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker tag  "${REGISTRY}/${IMAGE_NAME}:${GITHUB_REF_NAME}" ix:base

      - name: Firecracker + kernel
        run: |
          sudo IX_FC_DIR=/opt/ix/firecracker \
            bash go-sdk/scripts/install-firecracker.sh "${FC_VERSION}"

      - name: Assemble rootfs
        run: |
          sudo IX_ROOTFS_IMAGE=/opt/ix/rootfs/base.ext4 IX_ROOTFS_SIZE=4096 \
            bash go-sdk/scripts/build-rootfs-ext4.sh base

      - name: Pack bundle
        run: |
          sudo bash go-sdk/scripts/pack-bundle.sh \
            "${GITHUB_REF_NAME}" "${SDK_COMPAT}" /opt/ix dist
          ls -la dist

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.zst
            dist/*.sha256
