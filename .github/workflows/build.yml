name: Build IX Sandbox

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test-daemon:
    name: Daemon (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Test
        working-directory: daemon
        run: cargo test --all

      - name: Build (musl static)
        working-directory: daemon
        run: cargo build --release --target x86_64-unknown-linux-musl -p ix-server

      - name: Upload daemon binary
        uses: actions/upload-artifact@v4
        with:
          name: ixd-linux-amd64
          path: daemon/target/x86_64-unknown-linux-musl/release/ixd

  test-sdk:
    name: Go SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go-sdk/go.mod
          cache-dependency-path: go-sdk/go.sum

      - name: Test
        working-directory: go-sdk
        run: go test ./... -count=1

  build-image:
    name: Docker Image
    needs: [test-daemon]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download daemon binary
        uses: actions/download-artifact@v4
        with:
          name: ixd-linux-amd64
          path: daemon/target/x86_64-unknown-linux-musl/release/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: daemon
          file: daemon/cmd/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ix
          cache-to: type=gha,mode=max,scope=ix
